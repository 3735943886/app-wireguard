---
name: ipTIME redirect (WireGuard)
version: 0.0.4
slug: wireguard
description: Redirect ipTIME router traffic over WireGuard (e.g. LG ThinQ to rusthinq)
url: https://github.com/3735943886/app-wireguard
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:vpn
panel_title: ipTIME redirect
ports:
  80/tcp: null
  51820/udp: 51830
ports_description:
  80/tcp: WireGuard peers status API
  51820/udp: "WireGuard: forward this port in your router"
hassio_api: true
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
map:
  - ssl:rw
options:
  server:
    addresses:
      - 172.27.66.1
    dns: []
  peers:
    - name: iptime
      addresses:
        - 172.27.66.2
      allowed_ips: []
      client_allowed_ips: []
      client_dns: "off"
  redirects:
    - port: 443
      to_port: 443
    - port: 8883
      to_port: 8883
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  log_client_config: bool?
  server:
    host: str?
    interface: match(^wg([0-9])+$)?
    addresses:
      - str
    dns:
      - str
    private_key: password?
    public_key: str?
    fwmark: str?
    table: str?
    pre_up: str?
    pre_down: str?
    post_up: str?
    post_down: str?
    mtu: int?
  peers:
    - name: match(^[a-zA-Z0-9\d](?:[a-zA-Z0-9\d]|-(?=[a-zA-Z0-9\d])){0,32}$)
      private_key: str?
      public_key: str?
      addresses:
        - str
      allowed_ips:
        - str
      client_allowed_ips:
        - str
      client_dns: str?
      persistent_keep_alive: int?
      endpoint: str?
      pre_shared_key: str?
      fwmark: str?
  redirects:
    - port: port
      protocol: list(tcp|udp)?
      to_host: str?
      to_port: port?
